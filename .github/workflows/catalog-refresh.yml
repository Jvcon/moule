name: Catalog refresh (report)

on:
  schedule:
    - cron: "0 6 * * 1" # 每周一 06:00 UTC
  workflow_dispatch:

jobs:
  versions:
    name: report outdated versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: bun install --frozen-lockfile
      - name: report
        run: bun run scripts/check-versions.ts
